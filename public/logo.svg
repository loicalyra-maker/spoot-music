<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Dégradé de fond Liquid Glass 4K -->
    <linearGradient id="spotBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041824"/>
      <stop offset="50%" stop-color="#06293D"/>
      <stop offset="100%" stop-color="#02111A"/>
    </linearGradient>

    <!-- Dégradé Cyan Éclatant pour l'icône et l'anneau -->
    <linearGradient id="spotCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>

    <!-- Reflet Spéculaire Supérieur -->
    <linearGradient id="spotSpecular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Halo Lumineux Néon 4K -->
    <filter id="spotNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Conteneur Carré Arrondi (Squircle Apple-grade) -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#spotBg)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>

  <!-- Halo d'ambiance interne -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="url(#spotCyan)" stroke-width="1.5" stroke-opacity="0.4" filter="url(#spotNeonGlow)"/>

  <!-- Reflet supérieur verre liquide -->
  <path d="M 8 34 C 8 20 20 8 34 8 L 94 8 C 108 8 120 20 120 34 L 120 54 C 80 48 48 58 8 68 Z" fill="url(#spotSpecular)"/>

  <!-- Glyphe S Stylisé Vectoriel Ultra-Net -->
  <g filter="url(#spotNeonGlow)">
    <path d="M 78 40 C 78 33 70 28 60 28 C 48 28 42 34 42 43 C 42 54 52 58 66 63 C 82 68 90 75 90 88 C 90 101 78 108 63 108 C 47 108 38 100 37 88 L 51 88 C 52 94 57 97 64 97 C 71 97 76 93 76 87 C 76 80 70 76 56 71 C 42 66 30 60 30 45 C 30 32 42 20 60 20 C 76 20 88 30 89 40 Z" fill="url(#spotCyan)"/>
    <!-- Point d'onde sonore Hi-Res -->
    <circle cx="86" cy="32" r="4.5" fill="#38BDF8"/>
  </g>
</svg>
