[package]
name = "spoot-music-core"
version = "0.1.0"
description = "Spoot Music — High-Fidelity Zero-Latency Audio Engine & Low-Footprint Desktop Core (Tauri v2)"
authors = ["Spoot Music Systems Architecture Team"]
edition = "2021"

[lib]
name = "spoot_music_core_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.0.0-rc", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
rand = "0.8"
uuid = { version = "1.8", features = ["v4", "serde"] }
rubato = "0.15" # High-quality sinc sample rate conversion (if needed)

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dxgi"
] }

[dev-dependencies]
criterion = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
